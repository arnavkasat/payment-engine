# A complete engine: PostgreSQL, a single-node Kafka in KRaft mode, the API
# and the settlement worker.
#
#   docker compose up --build
#   curl localhost:8080/healthz

name: payment-engine

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 3s
      retries: 30
    command:
      # The engine takes a row lock per account touched, so it wants
      # connections more than it wants a large shared buffer pool.
      - postgres
      - -c
      - max_connections=200

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The worker creates the topic itself at startup with an explicit
      # partition count (KAFKA_PARTITIONS), because partitions are what
      # bound settlement concurrency. Auto-creation stays on only as a
      # fallback for clients that reach the broker first.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: payment-engine-local-cluster
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  api:
    build: .
    command: ["/usr/local/bin/api"]
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://payments:payments@postgres:5432/payments?sslmode=disable"
      DATABASE_MAX_CONNS: "40"
      KAFKA_BROKERS: "kafka:19092"
      KAFKA_TOPIC: "payments.events"
      LOG_LEVEL: "info"
      # The dashboard's fault controls. Safe here because this compose file
      # is a local demo; never set it on anything reachable.
      ENABLE_FAULT_INJECTION: "true"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["/usr/local/bin/worker"]
    environment:
      DATABASE_URL: "postgres://payments:payments@postgres:5432/payments?sslmode=disable"
      DATABASE_MAX_CONNS: "20"
      KAFKA_BROKERS: "kafka:19092"
      KAFKA_TOPIC: "payments.events"
      CONSUMER_GROUP: "settlement"
      KAFKA_PARTITIONS: "6"
      OUTBOX_BATCH: "256"
      OUTBOX_INTERVAL: "20ms"
      LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
