name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"

jobs:
  check:
    name: Build, vet and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      # The race detector matters more here than anywhere: the engine's
      # whole claim is about what happens under concurrency.
      - name: Unit tests
        run: make test

  integration:
    name: PostgreSQL conformance and chaos
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The same conformance suite the in-memory store passes, run against
      # a real database. If the two ever diverge, this is where it shows.
      - name: Storage conformance against PostgreSQL
        run: make test-integration

      # Failure injection against real transactions, real row locks and a
      # real deferred constraint trigger.
      - name: Chaos run against PostgreSQL
        run: make chaos-postgres

  end-to-end:
    name: Full stack smoke test
    runs-on: ubuntu-latest

    env:
      # The API logs every request at info, and the load would bury
      # everything else under tens of thousands of lines. The worker stays
      # at info: its startup and publish logs are the ones worth having.
      API_LOG_LEVEL: warn
      WORKER_LOG_LEVEL: info

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Start PostgreSQL, Kafka, the API and the worker
        run: docker compose up --build -d

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/readyz > /dev/null; then
              echo "api ready"; exit 0
            fi
            sleep 2
          done
          echo "api never became ready"
          docker compose logs
          exit 1

      - name: The worker container runs the worker
        run: |
          worker_id=$(docker compose ps -q worker)
          test "$(docker inspect -f '{{.State.Running}}' "$worker_id")" = "true"

          # The image's CMD is the API. If a future change turns it back
          # into an ENTRYPOINT, compose's `command:` would be appended as
          # arguments and this service would silently run a second API --
          # which is exactly what happened once, and nothing settled for
          # three runs. This is a property of the container, true the
          # moment it exists, so it is checked directly.
          docker inspect -f '{{json .Config.Cmd}}' "$worker_id" | grep -q '/usr/local/bin/worker'
          docker compose ps

      - name: The dashboard is served
        run: |
          curl -sf http://localhost:8080/ | grep -q "Payment engine"
          curl -sf http://localhost:8080/v1/ledger/snapshot | python3 -m json.tool > /dev/null

      - name: Drive traffic through the whole pipeline
        run: go run ./cmd/loadgen -url http://localhost:8080 -concurrency 8 -requests 2000 -wallets 16 -warmup 2s

      - name: Wait for settlement to drain
        run: |
          # Every capture parks its amount in clearing and every settlement
          # takes it out again, so a zero clearing balance means the Kafka
          # round trip completed for every payment.
          for i in $(seq 1 90); do
            snapshot=$(curl -sf http://localhost:8080/v1/ledger/snapshot)
            read -r balance pending inflight <<<"$(printf '%s' "$snapshot" |
              python3 -c "import sys,json;d=json.load(sys.stdin);print(d['clearing_balance'],d['pending_outbox'],d['in_flight'])")"
            echo "clearing=$balance pending_events=$pending awaiting_settlement=$inflight"
            if [ "$balance" = "0" ] && [ "$pending" = "0" ]; then exit 0; fi
            sleep 2
          done
          echo "settlement did not drain"
          docker compose ps
          echo "--- worker ---"; docker compose logs --tail 120 worker
          echo "--- kafka ---";  docker compose logs --tail 60 kafka
          exit 1

      - name: Verify ledger invariants
        run: |
          # The endpoint returns 500 if any invariant is violated, so -f is
          # the assertion.
          curl -sf http://localhost:8080/v1/ledger/invariants | python3 -m json.tool

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 80

      - name: Tear down
        if: always()
        run: docker compose down -v
